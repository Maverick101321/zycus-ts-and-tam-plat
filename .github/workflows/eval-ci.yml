name: Evaluation CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-evals:
    name: Run AI Evaluation Harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run evaluation suite
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          OPENROUTER_MODELS: ${{ secrets.OPENROUTER_MODELS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          DEFAULT_TEMPERATURE: ${{ secrets.DEFAULT_TEMPERATURE }}
          DEFAULT_SEED: ${{ secrets.DEFAULT_SEED }}
        run: |
          python -m evals.run_evals

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: |
            evals/eval_report.md
            evals/eval_report.json
          if-no-files-found: warn
